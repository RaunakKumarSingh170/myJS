<html>
  <script>
    function asyncFunc1() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          console.log("some data1");
          resolve("success");
        }, 4000);
      });
    }

    function asyncFunc2() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          console.log("some data2");
          resolve("success");
        }, 4000);
      });
    }

    function asyncFunc3() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          console.log("some data3");
          resolve("success");
        }, 4000);
      });
    }

    asyncFunc1()
      .then((res) => {
        console.log("fetching data2....");
        return asyncFunc2(); // ← return the promise
      })
      .then((res) => {
        console.log("fetching data3....");
        return asyncFunc3(); // ← return the promise
      })
      .catch((err) => {
        console.log("something failed:", err);
      });
  </script>
</html>
